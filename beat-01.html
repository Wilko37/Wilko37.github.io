<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT 01</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
    <body>
        <main class="main-shell">
            <div class="main-content">
                <img class="logo" src="images/Logo.png" alt="WILKO">

                <div class="beat-player-grid">
                    <div class="player-section"></div>

                    <!--MIDDLE-->
                    <div class="player-section">
                        <div class="display-panel display-panel-beat"></div>
                        <div class="panel pad-panel">
                            <div class="pad">
                                <span class="pad-number">1</span>
                                <span class="pad-name">KICK</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">2</span>
                                <span class="pad-name">SNARE</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">3</span>
                                <span class="pad-name">HI HAT</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">4</span>
                                <span class="pad-name">OPEN HAT</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">5</span>
                                <span class="pad-name">808</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">6</span>
                                <span class="pad-name">CHORDS</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">7</span>
                                <span class="pad-name">MELODY</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">8</span>
                                <span class="pad-name">CLAP</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="pad">
                                <span class="pad-number">9</span>
                                <span class="pad-name">RIM</span>
                                <div class="pad-line"></div>
                            </div>
                        </div>
                    </div>
                    <div class="player-section">
                        <h4>PLAYBACK</h4>
                    </div>
                </div>

            <div class="panel navigation-panel">

            <!--HOME BUTTON-->
            <a class = "navigation-button" href="index.html">
              <span class="big-button-text">HOME</span>
              <div class="nav-button-line"></div>
            </a>

            <!--BEATS BUTTON-->
            <a class = "navigation-button active-button" href="beat-01.html">
              <span class="big-button-text">BEATS</span>
              <div class="nav-button-line active-button-line"></div>
            </a>

            <!--ABOUT BUTTON-->
            <a class = "navigation-button" href="about.html">
              <span class="big-button-text">ABOUT</span>
              <div class="nav-button-line"></div>
            </a>
            </div>  
            </div>
      <div class="bottom-panel">
        <div class="screw-row">
          <img class="screw" src="images/Screw.png" alt="screw">
          <img class="screw" src="images/Screw.png" alt="screw">
        </div>
      </div>
        </main>
        <script src="script.js"></script>
    </body>
</html>
