<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BEAT 01</title>
    <link rel="stylesheet" href="style.css">

    <!-- Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
</head>
    <body>
        <main class="main-shell">
            <div class="main-content">
                <img class="logo" src="images/Logo.png" alt="WILKO">
                <div class="display-panel display-panel-beat">

                            <div class="beat-info">
                                <h4 class="white-text">#01</h4>
                                <h4 class="beat-01-title">AUTUMN WINDS</h4>
                            </div>

                            <div class="beat-divider"></div>

                            <div class="beat-details">
                                <div class="beat-detail">
                                    <h5>BPM</h5>
                                    <h6>128</h6>
                                </div>
                                <div class="beat-detail">
                                    <h5>KEY</h5>
                                    <h6>C# MAJOR</h6>
                                </div>
                            </div>
                        </div>

                <div class="beat-player-grid">
                    <div class="player-section player-section-left">
                        <div class="panel beat-player-panel">
                            <h4>SWITCH BEAT</h4>

                            <div class="beat-player-buttons">

                                <a class="h-b player-button switch-button" href="beat-01.html">
                                <span class="switch-button-text">PREV<br>BEAT</span>
                                <img class="switch-button-img" src="images/left-arrow.png" alt="Previous beat"
                                >
                                </a>
                                <a class="h-b player-button switch-button" href="beat-01.html">
                                <span class="switch-button-text">NEXT<br>BEAT</span>
                                <img class="switch-button-img" src="images/right-arrow.png"alt="Next beat"
                                >
                                </a>
                            </div>
                        </div>
                        <img class="vent-grill" src="images/Vent-Grill.png" alt="vent grill">
                    </div>

                    <!--MIDDLE-->
                    <div class="player-section player-section-middle">
                        
                        <div class="panel pad-panel">
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">1</span>
                                <span class="pad-name">MELODY</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">2</span>
                                <span class="pad-name">SNARE</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">3</span>
                                <span class="pad-name">KICK</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">4</span>
                                <span class="pad-name">HI HAT</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">5</span>
                                <span class="pad-name">OPEN HAT</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">6</span>
                                <span class="pad-name">SHAKER</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">7</span>
                                <span class="pad-name">CLAP</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">8</span>
                                <span class="pad-name">RIM</span>
                                <div class="pad-line"></div>
                            </div>
                            <div class="h-b hover-lightup pad">
                                <span class="pad-number">9</span>
                                <span class="pad-name">808</span>
                                <div class="pad-line"></div>
                            </div>
                        </div>
                    </div>

                    <!--RIGHT-->
                    <div class="player-section player-section-right">
                        <div class="panel beat-player-panel">
                            <h4>PLAYBACK</h4>
                            <div class="beat-player-buttons">
                                <div class="h-b player-button">
                                    <img class="player-button-img" src="images/play-button.png" alt="play button">
                                </div>
                                <div class="h-b player-button">
                                    <img class="player-button-img" src="images/pause-button.png" alt="pause button">
                                </div>
                            </div>
                        </div>
                        <div class="h-b info-button">
                            <h5 class="info-button-title">INFO</h5>
                            <img class="info-button-image" src="images/info-icon.png" alt="info icon">
                        </div>
                    </div>
                </div>

            <div class="panel navigation-panel">

            <!--HOME BUTTON-->
            <a class = "h-b hover-lightup navigation-button" href="index.html">
              <span class="big-button-text">HOME</span>
              <div class="nav-button-line"></div>
            </a>

            <!--BEATS BUTTON-->
            <a class = "h-b navigation-button active-button" href="beat-01.html">
              <span class="big-button-text">BEATS</span>
              <div class="nav-button-line active-button-line"></div>
            </a>

            <!--ABOUT BUTTON-->
            <a class = "h-b hover-lightup navigation-button" href="about.html">
              <span class="big-button-text">ABOUT</span>
              <div class="nav-button-line"></div>
            </a>
            </div>  
            </div>
      <div class="bottom-panel">
        <div class="screw-row">
          <img class="screw" src="images/Screw.png" alt="screw">
          <img class="screw" src="images/Screw.png" alt="screw">
        </div>
      </div>
        </main>
        <script>
            window.STEM_FILES = [
                'audio/beat-01/melody.mp3',
                'audio/beat-01/snare.mp3',
                'audio/beat-01/kick.mp3',
                'audio/beat-01/hi-hat.mp3',
                'audio/beat-01/open-hat.mp3',
                'audio/beat-01/shaker.mp3',
                'audio/beat-01/clap.mp3',
                'audio/beat-01/rim.mp3',
                'audio/beat-01/808.mp3',
            ]
        </script>
        <script src="https://cdnjs.cloudflare.com/ajax/libs/howler/2.2.4/howler.min.js"></script>
        <script src="beat-player.js"></script>
    </body>
</html>
